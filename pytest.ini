[pytest]
testpaths     = tests
python_files  = test_*.py
python_classes= Test*
python_functions = test_*

# Affichage verbose par défaut
addopts =
    -v
    --tb=short
    --no-header
    -rN

# Marqueurs personnalisés
markers =
    unit: Tests unitaires sans IO (rapides)
    integration: Tests avec vraie DB (nécessite MONGO_URI)
    slow: Tests lents (chargement modèle NLP réel)